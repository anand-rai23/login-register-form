<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: url('pic.jpg') no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 1rem;
    }

    .login-box {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      width: 100%;
      max-width: 400px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-weight: 600;
      font-size: 1.8rem;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.8rem 0.75rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid #fff;
      color: #fff;
      font-size: 1rem;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 0.75rem;
      transform: translateY(-50%);
      pointer-events: none;
      transition: 0.3s;
      color: #ccc;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -10px;
      font-size: 0.75rem;
      color: #fff;
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .form-options label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .form-options a {
      color: #fff;
      text-decoration: none;
    }

    .form-options a:hover {
      text-decoration: underline;
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      background-color: #fff;
      color: #000;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .login-btn:hover {
      background-color: #f1f1f1;
    }

    .register-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .register-link a {
      color: #fff;
      font-weight: 500;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 2rem 1.5rem;
      }

      .login-box h2 {
        font-size: 1.5rem;
      }

      .form-options {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <input type="email" id="loginEmail" required placeholder=" " />
        <label>Email</label>
      </div>

      <div class="form-group">
        <input type="password" id="loginPassword" required placeholder=" " />
        <label>Password</label>
      </div>

      <div class="form-options">
        <label><input type="checkbox" /> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <p class="register-link">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </form>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const loginEmail = document.getElementById('loginEmail').value.trim();
      const loginPassword = document.getElementById('loginPassword').value;

      const storedEmail = localStorage.getItem("regEmail");
      const storedPassword = localStorage.getItem("regPassword");

      if (loginEmail === storedEmail && loginPassword === storedPassword) {
        alert("Login successful!");
        // Redirect to dashboard/homepage (make dashboard.html if needed)
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid email or password.");
      }
    });
  </script>

</body>
</html>
